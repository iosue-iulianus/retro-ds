// Built by scripts/build-android.sh, which fetches SDL2, builds the bsnes
// core into src/main/jniLibs (libsnes_a.so ...) and passes SDL's path:
//   -PsdlDir=...
// Release signing (optional; debug-signed otherwise) from the environment:
//   RETRODS_KEYSTORE, RETRODS_KEYSTORE_PASSWORD, RETRODS_KEY_ALIAS, RETRODS_KEY_PASSWORD
plugins {
    id "com.android.application"
}

def need = { String name ->
    if (!project.hasProperty(name)) throw new GradleException("-P${name}=... missing (build with scripts/build-android.sh)")
    return file(project.property(name)).absolutePath
}
def sdlDir = need("sdlDir")
def cpuFlags = project.hasProperty("cpuFlags") ? project.property("cpuFlags") : ""
def appVersion = rootProject.file("../VERSION").text.trim()
def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as int
def keystore = System.getenv("RETRODS_KEYSTORE")

android {
    namespace "io.github.iosue_iulianus.snesds"
    compileSdk 34
    def ndkDir = System.getenv("ANDROID_NDK_HOME") ?: System.getenv("ANDROID_NDK_LATEST_HOME")
    if (ndkDir) {
        ndkPath ndkDir
        // AGP insists ndkVersion matches the NDK at ndkPath
        def props = new Properties()
        new File(ndkDir, "source.properties").withInputStream { props.load(it) }
        ndkVersion props.getProperty("Pkg.Revision")
    }

    defaultConfig {
        // SNES DS's own ID, so it installs beside GBA DS instead of replacing it.
        applicationId "io.github.iosue_iulianus.snesds"
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName appVersion
        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static",
                        "-DRETRODS_SDL_SRC=${sdlDir}",
                        "-DRETRODS_VERSION=${appVersion}"
            }
        }
    }

    signingConfigs {
        if (keystore) {
            release {
                storeFile file(keystore)
                storePassword System.getenv("RETRODS_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RETRODS_KEY_ALIAS")
                keyPassword System.getenv("RETRODS_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystore ? signingConfigs.release : signingConfigs.debug
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Release"
                    cFlags "-O2", *(cpuFlags ? [cpuFlags] : [])
                }
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    // The native libraries as files in the app's folder (nativeLibraryDir),
    // not only inside the APK: SNES DS loads its core copies by path
    // (src/emu.c, RETRODS_CORE_DIR).
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    sourceSets {
        main {
            // SDL's Java side (SDLActivity...) straight from the SDL source, so it always matches libSDL2.so
            java.srcDirs += "${sdlDir}/android-project/app/src/main/java"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
